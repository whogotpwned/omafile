name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint (Arch)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: System packages
        run: |
          pacman -Syu --noconfirm --needed rust gtk4 libadwaita vte4 pkgconf git jq curl python \
            desktop-file-utils libarchive xorg-server-xvfb xorg-xauth dbus ttf-dejavu qt6-declarative

      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arch-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: arch-cargo-

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings

      - name: Translations
        run: python scripts/check-i18n.py

      - name: Plugin manifest and versions
        run: bash plugin/validate.sh

      - name: Desktop entry
        run: desktop-file-validate data/io.github.whogotpwned.Omafile.desktop

      - name: Starts under Xvfb
        run: |
          export HOME="$RUNNER_TEMP/home" XDG_RUNTIME_DIR="$RUNNER_TEMP/run" GDK_BACKEND=x11 GSK_RENDERER=cairo GTK_A11Y=none OMAFILE_TRACE=1
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          target/release/omafile --version
          target/release/omafile --print-bindings | head -3
          xvfb-run -a dbus-run-session -- bash -c 'target/release/omafile "$HOME" > "$RUNNER_TEMP/run.log" 2>&1 & pid=$!; sleep 6; kill $pid; wait $pid 2>/dev/null; true'
          head -20 "$RUNNER_TEMP/run.log"
          if grep -q "CRITICAL" "$RUNNER_TEMP/run.log"; then echo "::warning::GTK criticals in the smoke run (see log)"; fi
          if grep -q "panicked" "$RUNNER_TEMP/run.log"; then echo "::error::omafile panicked on start"; exit 1; fi

      # omafile runs every one of its commands against itself, in a throwaway home folder:
      # nothing selected, a text file, a picture, a folder, a file with an awkward name.
      # It fails on a crash, a GTK critical, text that broke as markup, a dialog that does
      # not fit. Once in English at the usual size, and once in German as small as a tile
      # on a busy workspace (translations are longer, and have their own ampersands).
      - name: Self-test (every command; English, and German in a small window)
        run: |
          scripts/selftest.sh
          OMAFILE_LANG=de OMAFILE_SELFTEST_SIZE=760x460 scripts/selftest.sh

      # Everything omafile assumes about Omarchy (commands, folders, the theme format, the
      # templates, the shell's plugin interface), checked against Omarchy's own source.
      # The latest release must fit; the development branch is looked at so that a change
      # coming with the next release is seen early.
      - name: Fits Omarchy (latest release, development branch)
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/basecamp/omarchy.git 'v*' | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Latest Omarchy release: $latest"
          git clone -q --depth 1 --branch "$latest" https://github.com/basecamp/omarchy.git "$RUNNER_TEMP/omarchy-release"
          python scripts/check-omarchy.py "$RUNNER_TEMP/omarchy-release"
          git clone -q --depth 1 https://github.com/basecamp/omarchy.git "$RUNNER_TEMP/omarchy-dev"
          python scripts/check-omarchy.py "$RUNNER_TEMP/omarchy-dev" || echo "::warning::omafile no longer fits Omarchy's development branch (see the log): the next Omarchy release will need a change here"

      - name: Release tarball
        run: scripts/make-dist.sh --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: omafile-x86_64
          path: dist/*
          if-no-files-found: error

  package:
    name: makepkg (source PKGBUILD)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed rust gtk4 libadwaita vte4 git curl namcap

      - uses: actions/checkout@v4

      - name: Build the package from this checkout
        run: |
          useradd -m builder
          version="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          work=/home/builder/pkg
          mkdir -p "$work"
          # Same PKGBUILD as the AUR one, with the source pointed at this commit.
          git config --global --add safe.directory "$PWD"
          git archive --format=tar.gz --prefix="omafile-$version/" -o "$work/omafile-$version.tar.gz" HEAD
          sed "s|^source=.*|source=(\"omafile-$version.tar.gz\")|" PKGBUILD > "$work/PKGBUILD"
          chown -R builder "$work"
          su builder -c "cd $work && makepkg --noconfirm --skipchecksums -f"
          pacman -U --noconfirm "$work"/omafile-*.pkg.tar.zst
          omafile --version
          namcap "$work"/omafile-*.pkg.tar.zst || true

      - name: .SRCINFO is in sync
        run: |
          for pkg in omafile omafile-bin; do
            cp -r "packaging/aur/$pkg" "/home/builder/$pkg" && chown -R builder "/home/builder/$pkg"
            su builder -c "cd /home/builder/$pkg && makepkg --printsrcinfo > .SRCINFO.new"
            diff -u "packaging/aur/$pkg/.SRCINFO" "/home/builder/$pkg/.SRCINFO.new" || echo "::warning::packaging/aur/$pkg/.SRCINFO differs from makepkg --printsrcinfo: run packaging/aur/gen-srcinfo.sh on Arch before publishing"
          done
          diff -u PKGBUILD packaging/aur/omafile/PKGBUILD || { echo "::error::PKGBUILD and packaging/aur/omafile/PKGBUILD differ"; exit 1; }

  # The radio stations omafile starts with are addresses on the internet, and those move.
  # Every one is asked for sound; a station that no longer answers is a warning here (an
  # outage elsewhere must not stop a change to omafile) and a failure in the weekly run.
  radio:
    name: Built-in radio stations answer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask every station for sound
        run: |
          python3 scripts/check-radio.py || echo "::warning::A built-in radio station does not answer (see the log): replace it in src/radio.rs"
