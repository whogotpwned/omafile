[package]
name = "omafile"
version = "0.23.0"
edition = "2021"
description = "A native GTK4/libadwaita file manager for Omarchy"
license = "MIT"
repository = "https://github.com/whogotpwned/omafile"
readme = "README.md"
keywords = ["file-manager", "gtk4", "libadwaita", "omarchy", "hyprland"]
categories = ["gui", "filesystem"]

[[bin]]
name = "omafile"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gio = { version = "0.22", features = ["v2_72"] }
futures-util = "0.3"
futures-channel = "0.3"
regex = "1"
vte4 = { version = "0.10", features = ["v0_76"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
