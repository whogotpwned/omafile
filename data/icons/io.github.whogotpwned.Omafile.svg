<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24283b"/>
      <stop offset="1" stop-color="#13141c"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7da6ff"/>
      <stop offset="1" stop-color="#5a7fd6"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ab8ff"/>
      <stop offset="1" stop-color="#6f93e8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- accent glow behind the folder -->
  <ellipse cx="64" cy="76" rx="40" ry="24" fill="#7aa2f7" fill-opacity="0.35" filter="url(#glow)"/>

  <!-- folder back + tab -->
  <path d="M26 42c0-4.4 3.6-8 8-8h20c2.6 0 5 1.2 6.5 3.3L64 42h30c4.4 0 8 3.6 8 8v8H26z" fill="url(#tab)"/>
  <!-- folder body -->
  <rect x="26" y="50" width="76" height="46" rx="8" fill="url(#body)"/>
  <!-- front flap -->
  <path d="M26 64c0-3.3 2.7-6 6-6h64c3.3 0 6 2.7 6 6v26c0 3.3-2.7 6-6 6H32c-3.3 0-6-2.7-6-6z" fill="url(#front)"/>
  <!-- shine on the flap -->
  <path d="M26 64c0-3.3 2.7-6 6-6h64c3.3 0 6 2.7 6 6v10H26z" fill="url(#shine)"/>

  <!-- prompt chevron: the terminal below the files -->
  <path d="M46 71l9 7-9 7" fill="none" stroke="#1a1b26" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="59" y="83" width="18" height="4" rx="2" fill="#1a1b26" fill-opacity="0.85"/>

  <!-- soft shadow under the folder -->
  <rect x="30" y="97" width="68" height="4" rx="2" fill="#000000" fill-opacity="0.25" filter="url(#soft)"/>
</svg>
