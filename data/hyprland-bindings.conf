# omafile bindings for Omarchy. Append to ~/.config/hypr/bindings.conf
# (or `source` this file from there), then SUPER+ESC or `hyprctl reload`.

# Replace Nautilus on SUPER+F with omafile.
unbind = SUPER, F
bindd = SUPER, F, File manager, exec, uwsm app -- omafile

# Omarchy opens windows tiled. Uncomment to prefer a centered floating window instead:
# windowrule = float, class:^(io\.github\.whogotpwned\.Omafile)$
# windowrule = size 70% 70%, class:^(io\.github\.whogotpwned\.Omafile)$
# windowrule = center, class:^(io\.github\.whogotpwned\.Omafile)$
