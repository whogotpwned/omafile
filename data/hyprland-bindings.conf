# omafile bindings for Omarchy releases that still use ~/.config/hypr/bindings.conf
# (before the Lua configuration). Append there, then SUPER+ESC or `hyprctl reload`.

unbind = SUPER, F
bindd = SUPER, F, File manager, exec, uwsm app -- omafile

# Optional: centered floating window.
# windowrule = float, class:^(io\.github\.whogotpwned\.Omafile)$
# windowrule = size 70% 70%, class:^(io\.github\.whogotpwned\.Omafile)$
# windowrule = center, class:^(io\.github\.whogotpwned\.Omafile)$
