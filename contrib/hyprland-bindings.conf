# Omafile bindings for Omarchy. Append to ~/.config/hypr/bindings.conf
# (or `source` this file from there). Reload with SUPER+ESC or `hyprctl reload`.

# Open omafile in a new Alacritty window.
bindd = SUPER SHIFT, F, File manager (omafile), exec, uwsm app -- alacritty --class Omafile -e omafile

# Optional: make omafile the SUPER+F file manager instead of Nautilus.
# unbind = SUPER, F
# bindd = SUPER, F, File manager (omafile), exec, uwsm app -- alacritty --class Omafile -e omafile

# Optional: open it as a centered floating window.
# windowrule = float, class:^(Omafile)$
# windowrule = size 70% 70%, class:^(Omafile)$
# windowrule = center, class:^(Omafile)$
